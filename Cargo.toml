[workspace]
members = ["crates/eefn", "crates/eef", "crates/installer"]
resolver = "3"

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8.9"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
indexmap = { version = "2.11", features = ["serde"] }
rand = "0.9"
regex = "1.11"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yml = "0.0.12"
sha2 = "0.10"
sysinfo = { version = "0.37.2", default-features = false, features = ["disk", "system"] }
tempfile = "3.21"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["v4"] }
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }
fs2 = "0.4"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
