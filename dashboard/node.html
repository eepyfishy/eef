<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EEFN node dashboard</title>
<style>:root{color-scheme:dark;--bg:#101418;--panel:#192127;--text:#eef5f7;--accent:#55d6be;--warn:#ffd166}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}main{max-width:900px;margin:auto;padding:1rem}section{background:var(--panel);border:1px solid #3a4b53;border-radius:.7rem;padding:1rem;margin:1rem 0}textarea{width:100%;min-height:34rem;background:#0d1215;color:inherit;border:1px solid #71858e;border-radius:.4rem;padding:.7rem;font:14px/1.4 ui-monospace,monospace}button{font:inherit;padding:.65rem 1rem;color:inherit;background:#24463f;border:1px solid var(--accent);border-radius:.4rem;cursor:pointer}button:focus{outline:3px solid #ffffff55}.ok{color:var(--accent)}.warn{color:var(--warn)}</style></head>
<body><main><h1>EEFN node dashboard</h1><div id="notice" role="status" aria-live="polite"></div><section><h2>Node status</h2><div id="status">Loading…</div><button id="startup">Loading startup state…</button></section><section><h2>Complete node configuration</h2><p>Coordinator endpoints are tried by highest priority. Provider <code>auto</code> uses Ollama when reachable and otherwise uses bundled llama.cpp. Models are never selected or downloaded automatically.</p><textarea id="config" aria-label="Node configuration JSON"></textarea><p><button id="save">Save for restart</button> <button id="reload">Discard edits</button></p></section></main>
<script>const $=x=>document.getElementById(x),api=async(p,o={})=>{const r=await fetch(p,{headers:{'content-type':'application/json'},...o}),j=await r.json();if(!r.ok)throw Error(j.error||r.statusText);return j},say=(m,b=false)=>{$('notice').textContent=m;$('notice').className=b?'warn':'ok'};let startupEnabled=false;async function load(){try{const[s,c,a]=await Promise.all([api('/api/status'),api('/api/config'),api('/api/startup')]);$('status').innerHTML=`<p class="ok">${s.node_id} is running as a node.</p><p>EEF is not required for this node process. At least one EEF is required for coordinated network tasks.</p>`;$('config').value=JSON.stringify(c.config,null,2);startupEnabled=a.enabled;$('startup').textContent=startupEnabled?'Disable startup app':'Enable startup app';say('Configuration loaded.')}catch(e){say(e.message,true)}}$('save').onclick=async()=>{try{const c=JSON.parse($('config').value);await api('/api/config',{method:'PUT',body:JSON.stringify({config:c})});say('Saved. Restart EEFN to apply.')}catch(e){say(e.message,true)}};$('startup').onclick=async()=>{try{const a=await api('/api/startup',{method:'PUT',body:JSON.stringify({enabled:!startupEnabled})});startupEnabled=a.enabled;$('startup').textContent=startupEnabled?'Disable startup app':'Enable startup app';say(startupEnabled?'EEFN startup enabled.':'EEFN startup disabled.')}catch(e){say(e.message,true)}};$('reload').onclick=load;load();</script></body></html>
