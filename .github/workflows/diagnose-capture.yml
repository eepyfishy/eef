name: Reserved capture diagnostic

on:
  push:
    branches: ['diagnostic/capture/**']

permissions:
  contents: read

concurrency:
  group: reserved-capture-diagnostic-${{ github.ref }}
  cancel-in-progress: false

env:
  EEF_CI_RUST: '1.98.1'
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUST_TEST_THREADS: '1'

jobs:
  component:
    name: Windows reserved one-shot component
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11.9'
      - name: Select the same pinned compiler
        run: |
          rustup toolchain install $env:EEF_CI_RUST --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default $env:EEF_CI_RUST
          exit $LASTEXITCODE
      - name: Fetch only locked dependencies
        run: |
          cargo fetch --locked
          exit $LASTEXITCODE
      - name: Diagnose the exact synthetic reserved capture case
        run: |
          $env:EEF_TEST_PYTHON = (Get-Command python.exe -ErrorAction Stop).Source
          # This is a diagnostic branch only. It cannot replace the four-job
          # verification workflow, native command suites or physical acceptance.
          cargo test -p eefn --lib --no-default-features --features native-test-fixtures --locked --offline -j2 python::tests::reserved_one_shot_wav_capture_releases_only_after_owned_exit_and_can_run_again -- --exact --nocapture 2>&1 | Tee-Object -Variable capturedOutput
          $result = $LASTEXITCODE
          if ($result -ne 0) { exit $result }
          $summary = @($capturedOutput | ForEach-Object { $_.ToString() } | Where-Object { $_ -match '^test result: ok\. 1 passed; 0 failed; 0 ignored;' })
          if ($summary.Count -ne 1) { throw 'Diagnostic did not execute exactly one required case' }
          exit 0
