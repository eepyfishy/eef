name: Owned proxy observation diagnostic

on:
  push:
    branches: ['diagnostic/capture/proxy-identities-v4']

permissions:
  contents: read

env:
  EEF_CI_RUST: '1.98.1'
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUST_TEST_THREADS: '1'

jobs:
  component:
    name: Windows owned proxy observation
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Select the same pinned compiler
        run: |
          rustup toolchain install $env:EEF_CI_RUST --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default $env:EEF_CI_RUST
          exit $LASTEXITCODE
      - name: Fetch only locked dependencies
        run: |
          cargo fetch --locked
          exit $LASTEXITCODE
      - name: Diagnose the exact proxy observation case with default features
        run: |
          # Diagnostic only: the original test, bounds and release predicate
          # are unchanged. It cannot replace full acceptance.
          cargo test -p eefn --lib --locked --offline -j2 process_lifetime::tests::live_root_wait_retains_a_helper_before_root_and_helper_exit -- --exact --nocapture 2>&1 | Tee-Object -Variable capturedOutput
          $result = $LASTEXITCODE
          if ($result -ne 0) { exit $result }
          $summary = @($capturedOutput | ForEach-Object { $_.ToString() } | Where-Object { $_ -match '^test result: ok\. 1 passed; 0 failed; 0 ignored;' })
          if ($summary.Count -ne 1) { throw 'Diagnostic did not execute exactly one required case' }
          exit 0
